name: VS Code compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vscode-compatibility.yml'
      - '.github/actions/e2e/**'
      - 'tests/vscode/**'
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / VS Code ${{ matrix.version || 'minimum' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ['', latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npm run package

      - name: Capture VSIX path
        id: vsix
        shell: bash
        run: echo "path=$(node -p 'const p = require("./package.json"); `${p.name}-${p.version}.vsix`')" >> "$GITHUB_OUTPUT"

      - name: Desktop compatibility tests
        uses: ./.github/actions/e2e
        with:
          vsix: ${{ steps.vsix.outputs.path }}
          vscode-version: ${{ matrix.version }}
          browser-tests: 'false'
