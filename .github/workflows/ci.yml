name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck + lint + spellcheck + knip + test)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Check bundle and VSIX size
        run: npm run check-size

      - name: Capture VSIX path
        id: vsix
        run: echo "path=$(node -p 'const p = require("./package.json"); `${p.name}-${p.version}.vsix`')" >> "$GITHUB_OUTPUT"

      - name: End-to-end tests
        uses: ./.github/actions/e2e
        with:
          vsix: ${{ steps.vsix.outputs.path }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.path }}
