name: Extension end-to-end tests
description: Test an existing VSIX in isolated VS Code and optionally run the browser suite.

inputs:
  vsix:
    description: Exact VSIX produced by the caller's packaging step.
    required: true
  vscode-version:
    description: Exact VS Code version or latest; empty uses engines.vscode's minimum.
    default: ''
  browser-tests:
    description: Also run the browser-only Playwright suite.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Cache desktop downloads
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .vscode-test/cache
        key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.vscode-version || 'minimum' }}-${{ hashFiles('package.json', 'package-lock.json') }}-${{ inputs.vscode-version == 'latest' && github.run_id || 'pinned' }}
        restore-keys: |
          vscode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.vscode-version || 'minimum' }}-${{ hashFiles('package.json', 'package-lock.json') }}-

    - name: Install Linux display and browser libraries
      if: runner.os == 'Linux'
      shell: bash
      run: npx playwright install-deps chromium

    - name: Install browser test Chromium
      if: inputs.browser-tests == 'true'
      shell: bash
      run: npx playwright install chromium

    - name: Browser webview tests
      if: inputs.browser-tests == 'true'
      shell: bash
      run: npm run test:e2e

    - name: Packaged VSIX smoke tests
      shell: bash
      env:
        TEST_VSIX: ${{ inputs.vsix }}
        TEST_VSCODE_VERSION: ${{ inputs.vscode-version }}
      run: |
        args=(--vsix "$TEST_VSIX")
        if [ -n "$TEST_VSCODE_VERSION" ]; then
          args+=(--vscode-version "$TEST_VSCODE_VERSION")
        fi
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a --server-args="-screen 0 1280x900x24" npm run test:vscode -- "${args[@]}"
        else
          npm run test:vscode -- "${args[@]}"
        fi

    - name: Upload test diagnostics
      id: diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-${{ runner.os }}-${{ inputs.vscode-version || 'minimum' }}
        path: test-results/
        if-no-files-found: warn
        retention-days: 7

    - name: Summarize desktop snapshots
      if: always()
      shell: bash
      env:
        E2E_ARTIFACT_URL: ${{ steps.diagnostics.outputs.artifact-url }}
      run: |
        shopt -s nullglob
        reports=(test-results/vscode/*/snapshots.md)
        if [ "${#reports[@]}" -eq 0 ]; then
          printf '## VS Code smoke snapshots\n\nNo desktop snapshot report was produced. Check the test-step logs.\n' >> "$GITHUB_STEP_SUMMARY"
        else
          for report in "${reports[@]}"; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
        fi
        if [ -n "$E2E_ARTIFACT_URL" ]; then
          printf '\n[Download screenshots and test diagnostics](%s)\n\nExtract the artifact and open `vscode/<run>/gallery.html` to browse the milestone snapshots. Individual PNGs are under each suite'\''s `snapshots` directory; failure screenshots remain under `screenshots`.\n' "$E2E_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
        fi
