<link href="./webview/styles.css" rel="stylesheet">
<title>AI Engineer Coach</title>
<style>
  /* Reserve space at top of sidebar for the macOS traffic-light buttons
     (hidden-inset titleBarStyle puts them at ~y=10..25 in the window).
     Without this padding, "OBSERVE" sits underneath the close/min/max buttons. */
  #sidebar { padding-top: 36px; }
  /* The drag region (#titlebar-drag) shouldn't capture clicks meant for nav items below it. */
  #titlebar-drag { pointer-events: none; }
  /* Traffic-light themselves must remain clickable — leave a clear box for them. */
  #titlebar-drag::before {
    content: ''; position: absolute; top: 0; left: 0; width: 80px; height: 28px;
    -webkit-app-region: no-drag;
  }
</style>
</head>

        <span data-i18n="sidebar.codingMoments">Coding Moments</span>

      <li><a href="#" data-page="output">

    <div class="sidebar-filters">
      <div class="sidebar-filter">
        <label data-i18n="filters.workspace">Workspace</label>
        <div class="ws-toggle" id="ws-toggle">
          <button class="ws-toggle-btn active" data-ws="current" data-i18n="filters.current">Current</button>
          <button class="ws-toggle-btn" data-ws="all" data-i18n="filters.all">All</button>
        </div>
        <div class="combobox" id="ws-combobox">
          <input type="text" id="ws-filter-input" data-i18n-attr="placeholder:filters.searchWorkspaces" placeholder="Search workspaces..." autocomplete="off" />
          <div class="combobox-list" id="ws-filter-list"></div>

      <div class="sidebar-filter">

    </div>

  <main id="content"></main>
</div>
<script>
  // Bridge the existing acquireVsCodeApi() contract to Electron IPC (exposed by preload).
  window.acquireVsCodeApi = window.__aiCoachAcquireApi;

  // Tiny i18n applicator: walks elements with data-i18n / data-i18n-attr and substitutes.
  // Re-runs whenever the user picks a new language from the app menu.
  (function () {
    function dig(obj, dottedKey) {
      return dottedKey.split('.').reduce((cur, k) => (cur == null ? undefined : cur[k]), obj);
    }
    function apply(translations) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = dig(translations, el.getAttribute('data-i18n'));
        if (typeof v === 'string') el.textContent = v;
      });
      document.querySelectorAll('[data-i18n-attr]').forEach(el => {
        const spec = el.getAttribute('data-i18n-attr');
        const [attr, key] = spec.split(':');
        const v = dig(translations, key);
        if (typeof v === 'string') el.setAttribute(attr, v);
      });
    }
    if (window.__aiCoachI18n) {
      window.__aiCoachI18n.load().then(({ translations, lang }) => {
        document.documentElement.lang = lang;
        apply(translations[lang] || translations.en);
      });
      window.__aiCoachI18n.onLanguageChanged(({ lang, translations }) => {
        document.documentElement.lang = lang;
        apply(translations[lang] || translations.en);
      });
    }
  })();
</script>
<script src="./webview/app.js"></script>
</body>
</html>
